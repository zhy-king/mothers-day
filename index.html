<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="母亲节快乐">
<meta property="og:description" content="献给最爱的妈妈，祝您节日快乐">
<meta property="og:type" content="website">
<title>母亲节快乐</title>
<style>
:root {
  --rose: #D4888A;
  --rose-deep: #B86164;
  --rose-light: #F2D4D6;
  --gold: #C9A96E;
  --gold-light: #E8D5B0;
  --cream: #FDF8F4;
  --card-bg: #FFFFFF;
  --text: #5C3D3F;
  --text-secondary: #9B7B7D;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--cream);
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Serif SC", serif;
  color: var(--text);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
}

#petalCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 100;
}

.page {
  max-width: 420px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
  padding-bottom: 40px;
}

.top-hint {
  text-align: center;
  padding: 12px;
  font-size: 13px;
  color: var(--text-secondary);
  letter-spacing: 1px;
  opacity: 0;
  animation: fadeIn 0.6s 2s ease both;
}

/* ===== Hero ===== */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 50px 24px 40px;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: -80px; left: -40px;
  width: 260px; height: 260px;
  background: radial-gradient(circle, rgba(244,200,200,0.35) 0%, transparent 70%);
  border-radius: 50%; z-index: 0;
}
.hero::after {
  content: '';
  position: absolute;
  bottom: -40px; right: -30px;
  width: 180px; height: 180px;
  background: radial-gradient(circle, rgba(232,213,176,0.30) 0%, transparent 70%);
  border-radius: 50%; z-index: 0;
}
.hero-badge {
  background: linear-gradient(135deg, var(--rose-light), #FDE8E9);
  border: 1px solid rgba(212,136,138,0.2);
  border-radius: 20px;
  padding: 6px 22px;
  margin-bottom: 20px;
  z-index: 1;
  font-size: 13px;
  color: var(--rose-deep);
  letter-spacing: 3px;
  opacity: 0;
  animation: fadeIn 0.6s 0.2s ease both;
}
.hero-subtitle {
  font-size: 15px;
  color: var(--text-secondary);
  letter-spacing: 6px;
  margin-bottom: 10px;
  z-index: 1;
  opacity: 0;
  animation: fadeIn 0.6s 0.4s ease both;
}
.hero-title {
  display: flex; gap: 3px; z-index: 1; margin-bottom: 24px;
}
.hero-title span {
  font-size: 50px; font-weight: 700; color: var(--rose-deep);
  opacity: 0;
  animation: charReveal 0.5s cubic-bezier(.22,.61,.36,1) forwards;
  text-shadow: 0 2px 6px rgba(184,97,100,0.15);
}
.hero-title span:nth-child(1) { animation-delay: 0.5s; }
.hero-title span:nth-child(2) { animation-delay: 0.58s; }
.hero-title span:nth-child(3) { animation-delay: 0.66s; }
.hero-title span:nth-child(4) { animation-delay: 0.74s; }
.hero-title span:nth-child(5) { animation-delay: 0.82s; }

@keyframes charReveal {
  from { opacity: 0; transform: translateY(14px) scale(0.9); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* 康乃馨 */
.flower-wrap { z-index: 1; animation: floatFlower 3s ease-in-out infinite; }
@keyframes floatFlower {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.carnation { position: relative; width: 72px; height: 110px; }
.petal { position: absolute; border-radius: 50%; background: linear-gradient(135deg, #F2A6A9, #E88186); }
.p1 { width: 26px; height: 26px; top: 0; left: 23px; }
.p2 { width: 24px; height: 24px; top: 3px; left: 10px; }
.p3 { width: 24px; height: 24px; top: 3px; right: 10px; }
.p4 { width: 22px; height: 22px; top: 12px; left: 5px; }
.p5 { width: 22px; height: 22px; top: 12px; right: 5px; }
.petal-center { position: absolute; width: 14px; height: 14px; background: radial-gradient(circle, #FDE0D3, #F5C4B8); border-radius: 50%; top: 10px; left: 29px; }
.stem { position: absolute; width: 3px; height: 50px; background: linear-gradient(to bottom, #8FBC8F, #7AAA7A); border-radius: 2px; top: 36px; left: 34px; }
.leaf { position: absolute; width: 20px; height: 10px; background: linear-gradient(135deg, #9DC89D, #8FBC8F); border-radius: 50%; }
.l1 { top: 48px; left: 16px; transform: rotate(-30deg); }
.l2 { top: 60px; right: 16px; transform: rotate(25deg); }

/* ===== 祝福卡片 ===== */
.card {
  margin: 0 18px 28px;
  opacity: 0;
  animation: fadeInUp 0.7s 1.1s ease both;
}
.card-inner {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 30px 22px;
  box-shadow: 0 4px 20px rgba(180,130,130,0.12);
  position: relative;
  overflow: hidden;
}
.card-inner::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--rose-light), var(--gold-light), var(--rose-light));
}
.card-ribbon {
  position: absolute;
  top: -3px; right: 22px;
  width: 20px; height: 32px;
  background: linear-gradient(180deg, var(--rose), var(--rose-deep));
  border-radius: 0 0 4px 4px;
  z-index: 2;
}
.card-ribbon::after {
  content: '';
  position: absolute;
  bottom: -7px; left: -6px;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-top: 7px solid var(--rose-deep);
}
.card-title {
  font-size: 19px; font-weight: 600; color: var(--rose-deep);
  display: block; margin-bottom: 14px;
}
.card-body {
  font-size: 15px; line-height: 1.9; color: var(--text); display: block;
}
.card-divider {
  width: 32px; height: 1px;
  background: var(--rose-light);
  margin: 18px 0 14px;
}
.card-sign {
  font-size: 13px; color: var(--text-secondary);
  font-style: italic; display: block;
}

/* ===== 倒计时区域 ===== */
.countdown-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 460px;
  position: relative;
  padding: 20px;
}

.countdown-number {
  font-size: 100px;
  font-weight: 900;
  color: var(--rose-deep);
  opacity: 0;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.3);
  transition: all 0.5s cubic-bezier(.22,.61,.36,1);
}
.countdown-number.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
  animation: countPop 0.5s cubic-bezier(.22,.61,.36,1);
}
.countdown-number.fadeout {
  opacity: 0;
  transform: translate(-50%, -50%) scale(1.5);
  transition: all 0.4s ease-in;
}

@keyframes countPop {
  0% { transform: translate(-50%, -50%) scale(0.3); }
  60% { transform: translate(-50%, -50%) scale(1.15); }
  100% { transform: translate(-50%, -50%) scale(1); }
}

/* ===== 祝福文字跳动 ===== */
.blessing-words {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  opacity: 0;
  transition: opacity 0.6s ease;
}
.blessing-words.visible {
  opacity: 1;
}

.blessing-word {
  font-size: 36px;
  font-weight: 700;
  color: var(--rose-deep);
  opacity: 0;
  transform: translateY(40px);
  letter-spacing: 4px;
  text-shadow: 0 2px 8px rgba(184,97,100,0.12);
}
.blessing-word.bounce-in {
  animation: bounceIn 0.7s cubic-bezier(.22,.61,.36,1) forwards;
}

@keyframes bounceIn {
  0% { opacity: 0; transform: translateY(40px) scale(0.8); }
  50% { opacity: 1; transform: translateY(-10px) scale(1.05); }
  70% { transform: translateY(4px) scale(0.97); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.blessing-word.highlight {
  font-size: 44px;
  background: linear-gradient(135deg, #E8989B, #D07074);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ===== 落心区域 ===== */
.hearts-fall-area {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.falling-heart {
  position: absolute;
  font-size: 24px;
  color: var(--rose);
  animation: heartFall linear forwards;
  pointer-events: none;
}

@keyframes heartFall {
  0% {
    transform: translateY(-60px) rotate(0deg) scale(1);
    opacity: 1;
  }
  100% {
    transform: translateY(105vh) rotate(360deg) scale(0.3);
    opacity: 0;
  }
}

/* ===== 结尾大爱心 ===== */
.big-heart-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  opacity: 0;
  transform: scale(0);
  transition: all 0.8s cubic-bezier(.22,.61,.36,1);
}
.big-heart-wrap.show {
  opacity: 1;
  transform: scale(1);
}

.big-heart {
  font-size: 100px;
  animation: bigHeartPulse 1.2s ease-in-out infinite;
  filter: drop-shadow(0 4px 16px rgba(184,97,100,0.3));
}

@keyframes bigHeartPulse {
  0%,100% { transform: scale(1); }
  15% { transform: scale(1.18); }
  30% { transform: scale(1); }
  45% { transform: scale(1.12); }
  60% { transform: scale(1); }
}

/* ===== 底部 ===== */
.footer {
  text-align: center;
  padding: 40px 20px 30px;
  opacity: 0;
  transition: opacity 0.8s ease;
}
.footer.show {
  opacity: 1;
}
.footer h3 {
  font-size: 22px;
  color: var(--rose-deep);
  letter-spacing: 2px;
  margin-bottom: 10px;
}
.footer .hearts {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 8px;
}
.footer .hearts span {
  font-size: 22px;
  color: var(--rose);
  animation: heartBeat 1.6s ease-in-out infinite;
}
.footer .hearts span:nth-child(2) { animation-delay: 0.3s; }
.footer .hearts span:nth-child(3) { animation-delay: 0.6s; }

@keyframes heartBeat {
  0%,100% { transform: scale(1); opacity: 0.45; }
  50% { transform: scale(1.3); opacity: 1; }
}

.footer .sub {
  font-size: 13px;
  color: var(--text-secondary);
  letter-spacing: 2px;
  display: block;
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%) scale(0.8);
  background: rgba(92,61,63,0.92); color: #fff;
  padding: 12px 26px; border-radius: 20px;
  font-size: 14px; letter-spacing: 1px;
  z-index: 300;
  opacity: 0; pointer-events: none;
  transition: all 0.3s cubic-bezier(.22,.61,.36,1);
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }

/* 微信分享引导 */
.share-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 400;
  display: flex;
  align-items: flex-start; justify-content: flex-end;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
}
.share-overlay.show { opacity: 1; pointer-events: auto; }
.share-overlay .arrow {
  margin: 10px 16px 0 0;
  font-size: 15px; color: #fff; text-align: right;
}
.share-overlay .arrow .icon { font-size: 48px; display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<canvas id="petalCanvas"></canvas>
<div class="page">

  <!-- 提示 -->
  <div class="top-hint">⬆ 点击右上角 ··· 分享给妈妈</div>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-badge">2026.05.10</div>
    <div class="hero-subtitle">献给最爱的</div>
    <div class="hero-title">
      <span>母</span><span>亲</span><span>节</span><span>快</span><span>乐</span>
    </div>
    <div class="flower-wrap">
      <div class="carnation">
        <div class="petal p1"></div><div class="petal p2"></div>
        <div class="petal p3"></div><div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal-center"></div>
        <div class="stem"></div>
        <div class="leaf l1"></div><div class="leaf l2"></div>
      </div>
    </div>
  </section>

  <!-- 祝福卡片 -->
  <div class="card">
    <div class="card-inner">
      <div class="card-ribbon"></div>
      <span class="card-title">💌 致我亲爱的妈妈</span>
      <span class="card-body" id="greetingText"></span>
      <div class="card-divider"></div>
      <span class="card-sign">— 永远爱你的孩子</span>
    </div>
  </div>

  <!-- ===== 倒计时 + 祝福文字 ===== -->
  <div class="countdown-section" id="countdownSection">

    <!-- 爱心飘落区域 -->
    <div class="hearts-fall-area" id="heartsFallArea"></div>

    <!-- 倒计时数字 -->
    <div class="countdown-number" id="countNum3">3</div>
    <div class="countdown-number" id="countNum2">2</div>
    <div class="countdown-number" id="countNum1">1</div>

    <!-- 祝福文字 -->
    <div class="blessing-words" id="blessingWords">
      <span class="blessing-word">妈妈</span>
      <span class="blessing-word">健康顺遂</span>
      <span class="blessing-word">平平安安</span>
      <span class="blessing-word highlight">母亲节快乐</span>
    </div>

    <!-- 大爱心 -->
    <div class="big-heart-wrap" id="bigHeartWrap">
      <span class="big-heart">❤️</span>
    </div>

  </div>

  <!-- 底部 -->
  <div class="footer" id="footer">
    <h3>妈妈，我爱你</h3>
    <div class="hearts"><span>♥</span><span>♥</span><span>♥</span></div>
    <span class="sub">不止今天，每一天</span>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 微信分享引导 -->
<div class="share-overlay" id="shareOverlay" onclick="this.classList.remove('show')">
  <div class="arrow">
    <span class="icon">☝</span>
    点击右上角<br>「发送给朋友」<br>分享给妈妈 💝
  </div>
</div>

<script>
// ===== 花瓣动画 =====
const canvas = document.getElementById('petalCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const petals = [];
for (let i = 0; i < 28; i++) {
  petals.push({
    x: Math.random() * W,
    y: -60 - Math.random() * H,
    size: 7 + Math.random() * 12,
    speed: 0.3 + Math.random() * 1.1,
    drift: (Math.random() - 0.5) * 0.7,
    rotation: Math.random() * 360,
    rotSpeed: (Math.random() - 0.5) * 1.8,
    opacity: 0.2 + Math.random() * 0.45,
    color: Math.random() > 0.5 ? '#F2B8BA' : '#F5D5C8'
  });
}

(function loop() {
  ctx.clearRect(0, 0, W, H);
  petals.forEach(p => {
    p.y += p.speed;
    p.x += p.drift;
    p.rotation += p.rotSpeed;
    if (p.y > H + 60) { p.y = -60; p.x = Math.random() * W; }
    if (p.x > W + 40) p.x = -40;
    if (p.x < -40) p.x = W + 40;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation * Math.PI / 180);
    ctx.globalAlpha = p.opacity;
    ctx.beginPath();
    ctx.fillStyle = p.color;
    const s = p.size;
    ctx.moveTo(0, -s * 0.8);
    ctx.bezierCurveTo(s * 0.5, -s * 0.4, s * 0.5, s * 0.3, 0, s * 0.6);
    ctx.bezierCurveTo(-s * 0.5, s * 0.3, -s * 0.5, -s * 0.4, 0, -s * 0.8);
    ctx.fill();
    ctx.restore();
  });
  requestAnimationFrame(loop);
})();

// ===== 祝福语 =====
const greetings = [
  '亲爱的妈妈，感谢你用无私的爱陪伴我成长的每一步。你的笑容是我心中最温暖的阳光，你的双手是我最安心的港湾。今天是属于你的节日，愿你永远健康、快乐、美丽。',
  '妈妈，你是我生命中最重要的人。感谢你这么多年来的养育之恩，你的每一句叮咛，每一个拥抱，都是我前进的力量。母亲节快乐！',
  '世界上最美的词汇，就是"妈妈"。你的爱如春风化雨，润物无声。今天是母亲节，我想对你说：谢谢你，我爱你。',
];
document.getElementById('greetingText').textContent =
  greetings[Math.floor(Math.random() * greetings.length)];

// ===== Toast =====
let toastTimer;
function showToast(text) {
  const t = document.getElementById('toast');
  clearTimeout(toastTimer);
  t.textContent = text;
  t.classList.add('show');
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== 微信分享 =====
function showShareGuide() {
  const ua = navigator.userAgent.toLowerCase();
  if (ua.indexOf('micromessenger') > -1) {
    document.getElementById('shareOverlay').classList.add('show');
    setTimeout(() => document.getElementById('shareOverlay').classList.remove('show'), 4000);
  } else if (navigator.share) {
    navigator.share({
      title: '母亲节快乐',
      text: '💝 母亲节快乐！献给最爱的妈妈',
      url: window.location.href,
    }).catch(() => {});
  } else {
    navigator.clipboard.writeText(window.location.href).then(() => {
      showToast('链接已复制，去微信粘贴发送吧 💝');
    }).catch(() => showToast('请截图分享给妈妈吧 📸'));
  }
}

// ===== 倒计时 + 文字动画 =====
function startCountdown() {
  const num3 = document.getElementById('countNum3');
  const num2 = document.getElementById('countNum2');
  const num1 = document.getElementById('countNum1');
  const blessingWords = document.getElementById('blessingWords');
  const heartsArea = document.getElementById('heartsFallArea');
  const bigHeartWrap = document.getElementById('bigHeartWrap');
  const footer = document.getElementById('footer');

  // 显示 3
  setTimeout(() => {
    num3.classList.add('show');
  }, 200);

  // 3消失, 显示2
  setTimeout(() => {
    num3.classList.add('fadeout');
    setTimeout(() => {
      num3.classList.remove('show', 'fadeout');
      num2.classList.add('show');
    }, 350);
  }, 1200);

  // 2消失, 显示1
  setTimeout(() => {
    num2.classList.add('fadeout');
    setTimeout(() => {
      num2.classList.remove('show', 'fadeout');
      num1.classList.add('show');
    }, 350);
  }, 2200);

  // 1消失, 开始文字跳动 + 爱心飘落
  setTimeout(() => {
    num1.classList.add('fadeout');
    setTimeout(() => {
      num1.classList.remove('show', 'fadeout');
      // 显示祝福文字区域
      blessingWords.classList.add('visible');
      // 启动爱心飘落
      startHeartFalling(heartsArea);

      // 逐字弹跳出现
      const words = blessingWords.querySelectorAll('.blessing-word');
      words.forEach((word, i) => {
        setTimeout(() => {
          word.classList.add('bounce-in');
        }, i * 700);
      });

      // 大爱心出现
      const totalDelay = words.length * 700 + 600;
      setTimeout(() => {
        bigHeartWrap.classList.add('show');
      }, totalDelay);

      // 底部出现
      setTimeout(() => {
        footer.classList.add('show');
      }, totalDelay + 800);

    }, 350);
  }, 3200);
}

// ===== 爱心飘落 =====
function startHeartFalling(container) {
  const heartColors = ['#E88186', '#F2A6A9', '#E8989B', '#D4888A', '#F5C4B8', '#E8A0A4'];
  let heartId = 0;
  const hearts = [];

  function createHeart() {
    const heart = document.createElement('span');
    heart.className = 'falling-heart';
    heart.textContent = Math.random() > 0.5 ? '♥' : '❤';
    heart.style.left = Math.random() * 90 + 5 + '%';
    heart.style.fontSize = (16 + Math.random() * 28) + 'px';
    heart.style.color = heartColors[Math.floor(Math.random() * heartColors.length)];
    heart.style.animationDuration = (2.5 + Math.random() * 3.5) + 's';
    heart.style.animationDelay = '0s';
    heart.dataset.id = heartId++;

    container.appendChild(heart);
    hearts.push(heart);

    // 动画结束后移除
    const duration = parseFloat(heart.style.animationDuration) * 1000;
    setTimeout(() => {
      if (heart.parentNode) {
        heart.remove();
        const idx = hearts.indexOf(heart);
        if (idx > -1) hearts.splice(idx, 1);
      }
    }, duration + 100);
  }

  // 快速生成一波爱心
  for (let i = 0; i < 12; i++) {
    setTimeout(() => createHeart(), i * 120);
  }

  // 持续生成
  const interval = setInterval(() => {
    if (hearts.length < 30) {
      createHeart();
    }
  }, 350);

  // 15秒后停止
  setTimeout(() => {
    clearInterval(interval);
  }, 15000);
}

// ===== 启动动画序列 =====
// 等入场动画基本完成后再开始倒计时
setTimeout(() => {
  startCountdown();
}, 1800);
</script>
</body>
