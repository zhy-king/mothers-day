<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="母亲节快乐">
<meta property="og:description" content="献给最爱的妈妈，祝您节日快乐">
<meta property="og:image" content="">
<meta property="og:type" content="website">
<title>母亲节快乐</title>
<style>
:root {
  --rose: #D4888A;
  --rose-deep: #B86164;
  --rose-light: #F2D4D6;
  --gold: #C9A96E;
  --gold-light: #E8D5B0;
  --cream: #FDF8F4;
  --card-bg: #FFFFFF;
  --text: #5C3D3F;
  --text-secondary: #9B7B7D;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--cream);
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Serif SC", serif;
  color: var(--text);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
}

/* ===== 花瓣画布 ===== */
#petalCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 100;
}

.page {
  max-width: 420px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
  padding-bottom: 40px;
}

/* ===== 顶部引导条 ===== */
.top-hint {
  text-align: center;
  padding: 12px;
  font-size: 13px;
  color: var(--text-secondary);
  opacity: 0;
  animation: fadeIn 0.6s 2s ease both;
  letter-spacing: 1px;
}

/* ===== Hero ===== */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 50px 24px 40px;
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  top: -80px; left: -40px;
  width: 260px; height: 260px;
  background: radial-gradient(circle, rgba(244,200,200,0.35) 0%, transparent 70%);
  border-radius: 50%;
  z-index: 0;
}

.hero::after {
  content: '';
  position: absolute;
  bottom: -40px; right: -30px;
  width: 180px; height: 180px;
  background: radial-gradient(circle, rgba(232,213,176,0.30) 0%, transparent 70%);
  border-radius: 50%;
  z-index: 0;
}

.hero-badge {
  background: linear-gradient(135deg, var(--rose-light), #FDE8E9);
  border: 1px solid rgba(212,136,138,0.2);
  border-radius: 20px;
  padding: 6px 22px;
  margin-bottom: 20px;
  z-index: 1;
  font-size: 13px;
  color: var(--rose-deep);
  letter-spacing: 3px;
  opacity: 0;
  animation: fadeIn 0.6s 0.2s ease both;
}

.hero-subtitle {
  font-size: 15px;
  color: var(--text-secondary);
  letter-spacing: 6px;
  margin-bottom: 10px;
  z-index: 1;
  opacity: 0;
  animation: fadeIn 0.6s 0.4s ease both;
}

.hero-title {
  display: flex;
  gap: 3px;
  z-index: 1;
  margin-bottom: 24px;
}

.hero-title span {
  font-size: 50px;
  font-weight: 700;
  color: var(--rose-deep);
  opacity: 0;
  animation: charReveal 0.5s cubic-bezier(.22,.61,.36,1) forwards;
  text-shadow: 0 2px 6px rgba(184,97,100,0.15);
}
.hero-title span:nth-child(1) { animation-delay: 0.5s; }
.hero-title span:nth-child(2) { animation-delay: 0.58s; }
.hero-title span:nth-child(3) { animation-delay: 0.66s; }
.hero-title span:nth-child(4) { animation-delay: 0.74s; }
.hero-title span:nth-child(5) { animation-delay: 0.82s; }

@keyframes charReveal {
  from { opacity: 0; transform: translateY(14px) scale(0.9); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ===== 康乃馨 ===== */
.flower-wrap {
  z-index: 1;
  animation: floatFlower 3s ease-in-out infinite;
}

@keyframes floatFlower {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.carnation {
  position: relative;
  width: 72px; height: 110px;
}

.petal {
  position: absolute;
  border-radius: 50%;
  background: linear-gradient(135deg, #F2A6A9, #E88186);
}
.p1 { width: 26px; height: 26px; top: 0; left: 23px; }
.p2 { width: 24px; height: 24px; top: 3px; left: 10px; }
.p3 { width: 24px; height: 24px; top: 3px; right: 10px; }
.p4 { width: 22px; height: 22px; top: 12px; left: 5px; }
.p5 { width: 22px; height: 22px; top: 12px; right: 5px; }

.petal-center {
  position: absolute;
  width: 14px; height: 14px;
  background: radial-gradient(circle, #FDE0D3, #F5C4B8);
  border-radius: 50%;
  top: 10px; left: 29px;
}

.stem {
  position: absolute;
  width: 3px; height: 50px;
  background: linear-gradient(to bottom, #8FBC8F, #7AAA7A);
  border-radius: 2px;
  top: 36px; left: 34px;
}

.leaf {
  position: absolute;
  width: 20px; height: 10px;
  background: linear-gradient(135deg, #9DC89D, #8FBC8F);
  border-radius: 50%;
}
.l1 { top: 48px; left: 16px; transform: rotate(-30deg); }
.l2 { top: 60px; right: 16px; transform: rotate(25deg); }

/* ===== 祝福卡片 ===== */
.card {
  margin: 0 18px 28px;
  opacity: 0;
  animation: fadeInUp 0.7s 1.1s ease both;
}

.card-inner {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 30px 22px;
  box-shadow: 0 4px 20px rgba(180,130,130,0.12);
  position: relative;
  overflow: hidden;
}

.card-inner::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--rose-light), var(--gold-light), var(--rose-light));
}

.card-ribbon {
  position: absolute;
  top: -3px; right: 22px;
  width: 20px; height: 32px;
  background: linear-gradient(180deg, var(--rose), var(--rose-deep));
  border-radius: 0 0 4px 4px;
  z-index: 2;
}
.card-ribbon::after {
  content: '';
  position: absolute;
  bottom: -7px; left: -6px;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-top: 7px solid var(--rose-deep);
}

.card-title {
  font-size: 19px;
  font-weight: 600;
  color: var(--rose-deep);
  display: block;
  margin-bottom: 14px;
}

.card-body {
  font-size: 15px;
  line-height: 1.9;
  color: var(--text);
  display: block;
}

.card-divider {
  width: 32px; height: 1px;
  background: var(--rose-light);
  margin: 18px 0 14px;
}

.card-sign {
  font-size: 13px;
  color: var(--text-secondary);
  font-style: italic;
  display: block;
}

/* ===== 区域标题 ===== */
.section-head {
  text-align: center;
  padding: 12px 20px 18px;
  opacity: 0;
  animation: fadeIn 0.6s 0.3s ease both;
}
.section-head h2 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 3px;
  margin-bottom: 4px;
}
.section-head p {
  font-size: 13px;
  color: var(--text-secondary);
  letter-spacing: 1px;
}

/* ===== 记忆画廊 ===== */
.gallery {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding: 0 18px 26px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.gallery::-webkit-scrollbar { display: none; }

.memory-card {
  min-width: 140px;
  height: 170px;
  background: var(--card-bg);
  border-radius: 14px;
  padding: 20px 14px;
  box-shadow: 0 2px 12px rgba(180,130,130,0.08);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
  flex-shrink: 0;
}
.memory-card:active { transform: scale(0.96); }

.memory-card .icon { font-size: 34px; margin-bottom: 8px; }
.memory-card .title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.memory-card .desc { font-size: 11px; color: var(--text-secondary); text-align: center; line-height: 1.5; }

/* ===== 心愿清单 ===== */
.wish-list {
  padding: 0 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 28px;
}

.wish-item {
  display: flex;
  align-items: center;
  background: var(--card-bg);
  border-radius: 12px;
  padding: 16px 14px;
  box-shadow: 0 2px 12px rgba(180,130,130,0.08);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(.22,.61,.36,1);
}
.wish-item.done {
  opacity: 0.5;
  background: #FDF7F5;
}

.wish-check {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 2px solid var(--rose-light);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 12px;
  flex-shrink: 0;
  transition: all 0.3s;
  font-size: 14px;
  color: #fff;
}
.wish-check.done {
  background: linear-gradient(135deg, var(--rose), var(--rose-deep));
  border-color: var(--rose-deep);
}

.wish-body { flex: 1; }
.wish-text { font-size: 15px; font-weight: 500; display: block; margin-bottom: 2px; }
.wish-hint { font-size: 11px; color: var(--text-secondary); }

.wish-heart {
  font-size: 17px;
  color: var(--rose-light);
  transition: all 0.3s;
}
.wish-heart.done { color: var(--rose); transform: scale(1.2); }

/* ===== 分享卡片选择 ===== */
.share-cards {
  display: flex;
  gap: 10px;
  padding: 0 18px 22px;
  flex-wrap: wrap;
  justify-content: center;
}

.share-card {
  width: 110px; height: 140px;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 14px 10px;
  box-shadow: 0 2px 12px rgba(180,130,130,0.08);
  border: 2px solid transparent;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(.22,.61,.36,1);
  background: var(--card-bg);
}
.share-card.selected {
  border-color: var(--rose);
  transform: translateY(-3px);
  box-shadow: 0 6px 20px rgba(180,130,130,0.2);
}

.share-card-bg {
  position: absolute;
  inset: 0;
  opacity: 0.1;
  z-index: 0;
}

.share-card .s-text {
  position: relative; z-index: 1;
  font-size: 15px; font-weight: 600;
  text-align: center; margin-bottom: 4px;
}
.share-card .s-sub {
  position: relative; z-index: 1;
  font-size: 11px; color: var(--text-secondary);
  text-align: center;
}

/* ===== 分享按钮 ===== */
.share-btn {
  display: block;
  width: calc(100% - 36px);
  margin: 0 18px 28px;
  height: 48px;
  border-radius: 24px;
  background: linear-gradient(135deg, #E8989B, #D07074);
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 2px;
  border: none;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(200,120,125,0.3);
  transition: all 0.3s;
}
.share-btn:active { transform: scale(0.97); opacity: 0.9; }
.share-btn:disabled { background: #DDD; color: #AAA; box-shadow: none; }

/* ===== 底部 ===== */
.footer {
  text-align: center;
  padding: 36px 20px 30px;
}
.footer h3 {
  font-size: 20px;
  color: var(--rose-deep);
  letter-spacing: 2px;
  margin-bottom: 10px;
}
.footer .hearts {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 8px;
}
.footer .hearts span {
  font-size: 20px;
  color: var(--rose);
  animation: heartBeat 1.6s ease-in-out infinite;
}
.footer .hearts span:nth-child(2) { animation-delay: 0.3s; }
.footer .hearts span:nth-child(3) { animation-delay: 0.6s; }

@keyframes heartBeat {
  0%,100% { transform: scale(1); opacity: 0.45; }
  50% { transform: scale(1.3); opacity: 1; }
}

.footer .sub {
  font-size: 13px;
  color: var(--text-secondary);
  letter-spacing: 2px;
  display: block;
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%) scale(0.8);
  background: rgba(92,61,63,0.92);
  color: #fff;
  padding: 12px 26px;
  border-radius: 20px;
  font-size: 14px;
  letter-spacing: 1px;
  z-index: 300;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s cubic-bezier(.22,.61,.36,1);
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }

/* ===== 微信分享提示层 ===== */
.share-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 400;
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.share-overlay.show { opacity: 1; pointer-events: auto; }
.share-overlay .arrow {
  margin: 10px 16px 0 0;
  font-size: 15px;
  color: #fff;
  text-align: right;
}
.share-overlay .arrow .icon { font-size: 48px; display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<canvas id="petalCanvas"></canvas>
<div class="page">

  <!-- 提示 -->
  <div class="top-hint">⬆ 点击右上角 ··· 分享给妈妈</div>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-badge">2026.05.10</div>
    <div class="hero-subtitle">献给最爱的</div>
    <div class="hero-title">
      <span>母</span><span>亲</span><span>节</span><span>快</span><span>乐</span>
    </div>
    <div class="flower-wrap">
      <div class="carnation">
        <div class="petal p1"></div><div class="petal p2"></div>
        <div class="petal p3"></div><div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal-center"></div>
        <div class="stem"></div>
        <div class="leaf l1"></div><div class="leaf l2"></div>
      </div>
    </div>
  </section>

  <!-- 祝福卡片 -->
  <div class="card">
    <div class="card-inner">
      <div class="card-ribbon"></div>
      <span class="card-title">💌 致我亲爱的妈妈</span>
      <span class="card-body" id="greetingText"></span>
      <div class="card-divider"></div>
      <span class="card-sign">— 永远爱你的孩子</span>
    </div>
  </div>

  <!-- 美好瞬间 -->
  <div class="section-head"><h2>美好瞬间</h2><p>那些被时光铭记的温暖</p></div>
  <div class="gallery" id="gallery"></div>

  <!-- 心愿清单 -->
  <div class="section-head"><h2>今日心愿</h2><p>为妈妈做这些小事</p></div>
  <div class="wish-list" id="wishList"></div>

  <!-- 发送祝福 -->
  <div class="section-head"><h2>发送祝福</h2><p>选一张卡片分享给妈妈</p></div>
  <div class="share-cards" id="shareCards"></div>
  <button class="share-btn" id="sendBtn" disabled>💝 发送给妈妈</button>

  <!-- 底部 -->
  <div class="footer">
    <h3>妈妈，我爱你</h3>
    <div class="hearts"><span>♥</span><span>♥</span><span>♥</span></div>
    <span class="sub">不止今天，每一天</span>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 微信分享引导 -->
<div class="share-overlay" id="shareOverlay" onclick="this.classList.remove('show')">
  <div class="arrow">
    <span class="icon">☝</span>
    点击右上角<br>「发送给朋友」<br>分享给妈妈 💝
  </div>
</div>

<script>
// ===== 花瓣动画 =====
const canvas = document.getElementById('petalCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const petals = [];
for (let i = 0; i < 28; i++) {
  petals.push({
    x: Math.random() * W,
    y: -60 - Math.random() * H,
    size: 7 + Math.random() * 12,
    speed: 0.3 + Math.random() * 1.1,
    drift: (Math.random() - 0.5) * 0.7,
    rotation: Math.random() * 360,
    rotSpeed: (Math.random() - 0.5) * 1.8,
    opacity: 0.2 + Math.random() * 0.45,
    color: Math.random() > 0.5 ? '#F2B8BA' : '#F5D5C8'
  });
}

(function loop() {
  ctx.clearRect(0, 0, W, H);
  petals.forEach(p => {
    p.y += p.speed;
    p.x += p.drift;
    p.rotation += p.rotSpeed;
    if (p.y > H + 60) { p.y = -60; p.x = Math.random() * W; }
    if (p.x > W + 40) p.x = -40;
    if (p.x < -40) p.x = W + 40;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation * Math.PI / 180);
    ctx.globalAlpha = p.opacity;
    ctx.beginPath();
    ctx.fillStyle = p.color;
    const s = p.size;
    ctx.moveTo(0, -s * 0.8);
    ctx.bezierCurveTo(s * 0.5, -s * 0.4, s * 0.5, s * 0.3, 0, s * 0.6);
    ctx.bezierCurveTo(-s * 0.5, s * 0.3, -s * 0.5, -s * 0.4, 0, -s * 0.8);
    ctx.fill();
    ctx.restore();
  });
  requestAnimationFrame(loop);
})();

// ===== 祝福语 =====
const greetings = [
  '亲爱的妈妈，感谢你用无私的爱陪伴我成长的每一步。你的笑容是我心中最温暖的阳光，你的双手是我最安心的港湾。今天是属于你的节日，愿你永远健康、快乐、美丽。',
  '妈妈，你是我生命中最重要的人。感谢你这么多年来的养育之恩，你的每一句叮咛，每一个拥抱，都是我前进的力量。母亲节快乐！',
  '世界上最美的词汇，就是"妈妈"。你的爱如春风化雨，润物无声。今天是母亲节，我想对你说：谢谢你，我爱你。',
];
document.getElementById('greetingText').textContent =
  greetings[Math.floor(Math.random() * greetings.length)];

// ===== 美好瞬间 =====
const memories = [
  { icon: '🍼', title: '儿时呵护', desc: '用温柔的手牵我走过每一步' },
  { icon: '📚', title: '谆谆教诲', desc: '每一句话都是人生路上的灯' },
  { icon: '🍲', title: '家的味道', desc: '厨房里的香味是我最深的依恋' },
  { icon: '🤗', title: '温暖怀抱', desc: '无论多大你的拥抱永远最安全' },
  { icon: '🌹', title: '感恩有你', desc: '世界上最美的词就是妈妈' },
];
const galleryEl = document.getElementById('gallery');
memories.forEach(m => {
  const div = document.createElement('div');
  div.className = 'memory-card';
  div.innerHTML = `<span class="icon">${m.icon}</span><span class="title">${m.title}</span><span class="desc">${m.desc}</span>`;
  div.onclick = () => showToast(m.title + ' — ' + m.desc);
  galleryEl.appendChild(div);
});

// ===== 心愿清单 =====
const wishes = [
  { id: 1, text: '给妈妈一个大大的拥抱', hint: '抱紧一点哦 🤗', done: false },
  { id: 2, text: '为妈妈做一顿饭', hint: '用心做出家的味道 🍳', done: false },
  { id: 3, text: '陪妈妈散散步', hint: '聊聊家常，说说心里话 🌿', done: false },
  { id: 4, text: '送妈妈一束康乃馨', hint: '最美的花送给最美的人 💐', done: false },
  { id: 5, text: '对妈妈说"我爱你"', hint: '这三个字永远不嫌多 ❤️', done: false },
];
const wishListEl = document.getElementById('wishList');
wishes.forEach(w => {
  const div = document.createElement('div');
  div.className = 'wish-item';
  div.innerHTML = `
    <div class="wish-check"></div>
    <div class="wish-body"><span class="wish-text">${w.text}</span><span class="wish-hint">${w.hint}</span></div>
    <span class="wish-heart">♥</span>
  `;
  div.onclick = () => {
    w.done = !w.done;
    const check = div.querySelector('.wish-check');
    const heart = div.querySelector('.wish-heart');
    if (w.done) {
      div.classList.add('done');
      check.classList.add('done');
      check.textContent = '✓';
      heart.classList.add('done');
      showToast('太棒了！妈妈一定很开心 ✨');
    } else {
      div.classList.remove('done');
      check.classList.remove('done');
      check.textContent = '';
      heart.classList.remove('done');
    }
    if (wishes.every(ww => ww.done)) {
      setTimeout(() => showToast('全部完成！你是最棒的孩子 🌟'), 600);
    }
  };
  wishListEl.appendChild(div);
});

// ===== 分享卡片 =====
const shareCards = [
  { id: 1, text: '妈妈，我爱你', sub: '每一天都爱你', color: '#D4888A' },
  { id: 2, text: '你是最好的妈妈', sub: '感谢你的付出', color: '#C9A96E' },
  { id: 3, text: '永远做你的宝贝', sub: '有你的地方就是家', color: '#E8A0A4' },
  { id: 4, text: '妈妈辛苦了', sub: '今天请好好休息', color: '#B8C9A9' },
];
let selectedIdx = -1;
const shareCardsEl = document.getElementById('shareCards');
shareCards.forEach((sc, i) => {
  const div = document.createElement('div');
  div.className = 'share-card';
  div.innerHTML = `
    <div class="share-card-bg" style="background:${sc.color}"></div>
    <span class="s-text">${sc.text}</span><span class="s-sub">${sc.sub}</span>
  `;
  div.onclick = () => {
    const was = selectedIdx === i;
    document.querySelectorAll('.share-card').forEach(c => c.classList.remove('selected'));
    if (!was) {
      div.classList.add('selected');
      selectedIdx = i;
      document.getElementById('sendBtn').disabled = false;
    } else {
      selectedIdx = -1;
      document.getElementById('sendBtn').disabled = true;
    }
  };
  shareCardsEl.appendChild(div);
});

// ===== 发送按钮 =====
document.getElementById('sendBtn').onclick = () => {
  if (selectedIdx >= 0) {
    const card = shareCards[selectedIdx];
    // 尝试调用微信分享接口，不行则显示引导
    showShareGuide(card);
  }
};

function showShareGuide(card) {
  // 检测是否在微信中
  const ua = navigator.userAgent.toLowerCase();
  if (ua.indexOf('micromessenger') > -1) {
    document.getElementById('shareOverlay').classList.add('show');
    // 自动3秒后消失
    setTimeout(() => {
      document.getElementById('shareOverlay').classList.remove('show');
    }, 4000);
  } else {
    // 不在微信中，尝试 Web Share API
    if (navigator.share) {
      navigator.share({
        title: '母亲节快乐',
        text: `💝 ${card.text} — ${card.sub}`,
        url: window.location.href,
      }).catch(() => {});
    } else {
      // 复制链接
      const url = window.location.href;
      navigator.clipboard.writeText(url).then(() => {
        showToast('链接已复制，去微信粘贴发送吧 💝');
      }).catch(() => {
        showToast('请截图分享给妈妈吧 📸');
      });
    }
  }
}

// ===== Toast =====
let toastTimer;
function showToast(text) {
  const t = document.getElementById('toast');
  clearTimeout(toastTimer);
  t.textContent = text;
  t.classList.add('show');
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}
