<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="母亲节快乐">
<meta property="og:description" content="献给最爱的妈妈，祝您节日快乐">
<meta property="og:type" content="website">
<title>母亲节快乐</title>
<style>
:root {
  --rose: #D4888A;
  --rose-deep: #B86164;
  --rose-light: #F2D4D6;
  --cream: #FDF8F4;
  --card-bg: #FFFFFF;
  --text: #5C3D3F;
  --text-secondary: #9B7B7D;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--cream);
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Serif SC", serif;
  color: var(--text);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
}

#petalCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 100;
}

.page {
  max-width: 420px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
  padding-bottom: 40px;
}

.top-hint {
  text-align: center;
  padding: 12px;
  font-size: 13px;
  color: var(--text-secondary);
  letter-spacing: 1px;
  opacity: 0;
  animation: fadeIn 0.6s 2s ease both;
}

/* ===== Hero ===== */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 50px 24px 40px;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: -80px; left: -40px;
  width: 260px; height: 260px;
  background: radial-gradient(circle, rgba(244,200,200,0.35) 0%, transparent 70%);
  border-radius: 50%; z-index: 0;
}
.hero::after {
  content: '';
  position: absolute;
  bottom: -40px; right: -30px;
  width: 180px; height: 180px;
  background: radial-gradient(circle, rgba(232,213,176,0.30) 0%, transparent 70%);
  border-radius: 50%; z-index: 0;
}
.hero-badge {
  background: linear-gradient(135deg, var(--rose-light), #FDE8E9);
  border: 1px solid rgba(212,136,138,0.2);
  border-radius: 20px;
  padding: 6px 22px;
  margin-bottom: 20px;
  z-index: 1;
  font-size: 13px;
  color: var(--rose-deep);
  letter-spacing: 3px;
  opacity: 0;
  animation: fadeIn 0.6s 0.2s ease both;
}
.hero-subtitle {
  font-size: 15px;
  color: var(--text-secondary);
  letter-spacing: 6px;
  margin-bottom: 10px;
  z-index: 1;
  opacity: 0;
  animation: fadeIn 0.6s 0.4s ease both;
}
.hero-title {
  display: flex; gap: 3px; z-index: 1; margin-bottom: 24px;
}
.hero-title span {
  font-size: 50px; font-weight: 700; color: var(--rose-deep);
  opacity: 0;
  animation: charReveal 0.5s cubic-bezier(.22,.61,.36,1) forwards;
  text-shadow: 0 2px 6px rgba(184,97,100,0.15);
}
.hero-title span:nth-child(1) { animation-delay: 0.5s; }
.hero-title span:nth-child(2) { animation-delay: 0.58s; }
.hero-title span:nth-child(3) { animation-delay: 0.66s; }
.hero-title span:nth-child(4) { animation-delay: 0.74s; }
.hero-title span:nth-child(5) { animation-delay: 0.82s; }

@keyframes charReveal {
  from { opacity: 0; transform: translateY(14px) scale(0.9); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* 康乃馨 */
.flower-wrap { z-index: 1; animation: floatFlower 3s ease-in-out infinite; }
@keyframes floatFlower { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.carnation { position: relative; width: 72px; height: 110px; }
.petal { position: absolute; border-radius: 50%; background: linear-gradient(135deg, #F2A6A9, #E88186); }
.p1 { width: 26px; height: 26px; top: 0; left: 23px; }
.p2 { width: 24px; height: 24px; top: 3px; left: 10px; }
.p3 { width: 24px; height: 24px; top: 3px; right: 10px; }
.p4 { width: 22px; height: 22px; top: 12px; left: 5px; }
.p5 { width: 22px; height: 22px; top: 12px; right: 5px; }
.petal-center { position: absolute; width: 14px; height: 14px; background: radial-gradient(circle, #FDE0D3, #F5C4B8); border-radius: 50%; top: 10px; left: 29px; }
.stem { position: absolute; width: 3px; height: 50px; background: linear-gradient(to bottom, #8FBC8F, #7AAA7A); border-radius: 2px; top: 36px; left: 34px; }
.leaf { position: absolute; width: 20px; height: 10px; background: linear-gradient(135deg, #9DC89D, #8FBC8F); border-radius: 50%; }
.l1 { top: 48px; left: 16px; transform: rotate(-30deg); }
.l2 { top: 60px; right: 16px; transform: rotate(25deg); }

/* ===== 祝福卡片 ===== */
.card {
  margin: 0 18px 28px;
  opacity: 0;
  animation: fadeInUp 0.7s 1.1s ease both;
}
.card-inner {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 30px 22px;
  box-shadow: 0 4px 20px rgba(180,130,130,0.12);
  position: relative;
  overflow: hidden;
}
.card-inner::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--rose-light), #E8D5B0, var(--rose-light));
}
.card-ribbon {
  position: absolute;
  top: -3px; right: 22px;
  width: 20px; height: 32px;
  background: linear-gradient(180deg, var(--rose), var(--rose-deep));
  border-radius: 0 0 4px 4px;
  z-index: 2;
}
.card-ribbon::after {
  content: '';
  position: absolute;
  bottom: -7px; left: -6px;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-top: 7px solid var(--rose-deep);
}
.card-title {
  font-size: 19px; font-weight: 600; color: var(--rose-deep);
  display: block; margin-bottom: 14px;
}
.card-body {
  font-size: 15px; line-height: 1.9; color: var(--text); display: block;
}
.card-divider {
  width: 32px; height: 1px;
  background: var(--rose-light);
  margin: 18px 0 14px;
}
.card-sign {
  font-size: 13px; color: var(--text-secondary);
  font-style: italic; display: block;
}

/* ===== 按钮 ===== */
.btn-wrap {
  display: flex;
  justify-content: center;
  padding: 8px 18px 20px;
  opacity: 0;
  animation: fadeIn 0.6s 1.3s ease both;
}

.blessing-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  max-width: 320px;
  height: 52px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(135deg, #E8989B, #D07074);
  color: #fff;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 3px;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(200,120,125,0.35);
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.blessing-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent);
  pointer-events: none;
}
.blessing-btn:active {
  transform: scale(0.96);
  box-shadow: 0 4px 12px rgba(200,120,125,0.3);
}
.blessing-btn .btn-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #fff;
  animation: btnDotPulse 1.2s ease-in-out infinite;
}
.blessing-btn .btn-dot:nth-child(1) { animation-delay: 0s; }
.blessing-btn .btn-dot:nth-child(2) { animation-delay: 0.3s; }
.blessing-btn .btn-dot:nth-child(3) { animation-delay: 0.6s; }

@keyframes btnDotPulse {
  0%,100% { opacity: 0.4; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.3); }
}

/* ===== 全屏祝福层 ===== */
.blessing-overlay {
  position: fixed;
  inset: 0;
  background: var(--cream);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
  overflow: hidden;
}
.blessing-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

/* 鲜花爱心飘落画布 */
#fallCanvas {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 501;
}

/* 大爱心容器 */
.giant-heart-box {
  position: relative;
  width: 340px;
  height: 310px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 502;
}

/* CSS 大爱心 */
.giant-heart {
  position: absolute;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.giant-heart::before,
.giant-heart::after {
  content: '';
  position: absolute;
  top: 0;
  width: 170px;
  height: 270px;
  border-radius: 170px 170px 0 0;
  background: linear-gradient(180deg, rgba(232,152,155,0.18), rgba(212,136,138,0.08));
  box-shadow: 0 0 80px rgba(212,136,138,0.1), inset 0 0 60px rgba(255,255,255,0.15);
  border: 2px solid rgba(212,136,138,0.25);
  border-bottom: none;
}
.giant-heart::before {
  left: 0;
  transform: rotate(-45deg);
  transform-origin: 100% 100%;
}
.giant-heart::after {
  right: 0;
  transform: rotate(45deg);
  transform-origin: 0 100%;
}

/* 爱心内部内容 */
.heart-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  min-height: 260px;
}

/* 倒计时数字 */
.countdown-num {
  font-size: 80px;
  font-weight: 900;
  color: var(--rose-deep);
  opacity: 0;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.4);
  transition: all 0.45s cubic-bezier(.22,.61,.36,1);
}
.countdown-num.pop {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
  animation: numPop 0.45s cubic-bezier(.22,.61,.36,1);
}
.countdown-num.fade {
  opacity: 0;
  transform: translate(-50%, -50%) scale(1.6);
  transition: all 0.35s ease-in;
}

@keyframes numPop {
  0% { transform: translate(-50%, -50%) scale(0.4); }
  55% { transform: translate(-50%, -50%) scale(1.2); }
  100% { transform: translate(-50%, -50%) scale(1); }
}

/* ===== 祝福文字跳动 ===== */
.blessing-lines {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.blessing-lines.visible {
  opacity: 1;
}
.blessing-line {
  font-size: 28px;
  font-weight: 700;
  color: var(--rose-deep);
  opacity: 0;
  transform: translateY(30px);
  letter-spacing: 3px;
  text-shadow: 0 2px 6px rgba(184,97,100,0.1);
}
.blessing-line.bounce {
  animation: bounceWord 0.65s cubic-bezier(.22,.61,.36,1) forwards;
}
.blessing-line.emphasis {
  font-size: 34px;
  background: linear-gradient(135deg, #E88186, #C87075);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

@keyframes bounceWord {
  0% { opacity: 0; transform: translateY(30px) scale(0.85); }
  45% { opacity: 1; transform: translateY(-8px) scale(1.06); }
  65% { transform: translateY(3px) scale(0.98); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* ===== 结束大爱心（内部）===== */
.final-big-heart {
  font-size: 70px;
  opacity: 0;
  transform: scale(0);
  transition: all 0.7s cubic-bezier(.22,.61,.36,1);
}
.final-big-heart.reveal {
  opacity: 1;
  transform: scale(1);
  animation: finalPulse 1s ease-in-out infinite;
}

@keyframes finalPulse {
  0%,100% { transform: scale(1); }
  20% { transform: scale(1.15); }
  40% { transform: scale(1); }
}

/* 关闭按钮 */
.close-btn {
  position: absolute;
  top: 24px; right: 24px;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.85);
  border: none;
  font-size: 20px;
  color: var(--rose);
  cursor: pointer;
  z-index: 510;
  box-shadow: 0 2px 10px rgba(180,130,130,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
}
.close-btn:active { transform: scale(0.9); background: #fff; }

/* ===== 底部 ===== */
.footer {
  text-align: center;
  padding: 36px 20px 30px;
  opacity: 0;
  animation: fadeIn 0.6s 1.8s ease both;
}
.footer h3 {
  font-size: 20px; color: var(--rose-deep);
  letter-spacing: 2px; margin-bottom: 10px;
}
.footer .hearts {
  display: flex; justify-content: center; gap: 8px; margin-bottom: 8px;
}
.footer .hearts span {
  font-size: 20px; color: var(--rose);
  animation: heartBeat 1.6s ease-in-out infinite;
}
.footer .hearts span:nth-child(2) { animation-delay: 0.3s; }
.footer .hearts span:nth-child(3) { animation-delay: 0.6s; }

@keyframes heartBeat {
  0%,100% { transform: scale(1); opacity: 0.45; }
  50% { transform: scale(1.3); opacity: 1; }
}

.footer .sub {
  font-size: 13px; color: var(--text-secondary);
  letter-spacing: 2px; display: block;
}

/* Toast */
.toast {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%) scale(0.8);
  background: rgba(92,61,63,0.92); color: #fff;
  padding: 12px 26px; border-radius: 20px;
  font-size: 14px; letter-spacing: 1px;
  z-index: 600;
  opacity: 0; pointer-events: none;
  transition: all 0.3s cubic-bezier(.22,.61,.36,1);
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }

/* 微信分享引导 */
.share-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 700;
  display: flex;
  align-items: flex-start; justify-content: flex-end;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
}
.share-overlay.show { opacity: 1; pointer-events: auto; }
.share-overlay .arrow {
  margin: 10px 16px 0 0;
  font-size: 15px; color: #fff; text-align: right;
}
.share-overlay .arrow .icon { font-size: 48px; display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<canvas id="petalCanvas"></canvas>
<div class="page">

  <div class="top-hint">⬆ 点击右上角 ··· 分享给妈妈</div>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-badge">2026.05.10</div>
    <div class="hero-subtitle">献给最爱的</div>
    <div class="hero-title">
      <span>母</span><span>亲</span><span>节</span><span>快</span><span>乐</span>
    </div>
    <div class="flower-wrap">
      <div class="carnation">
        <div class="petal p1"></div><div class="petal p2"></div>
        <div class="petal p3"></div><div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal-center"></div>
        <div class="stem"></div>
        <div class="leaf l1"></div><div class="leaf l2"></div>
      </div>
    </div>
  </section>

  <!-- 祝福卡片 -->
  <div class="card">
    <div class="card-inner">
      <div class="card-ribbon"></div>
      <span class="card-title">💌 致我亲爱的妈妈</span>
      <span class="card-body" id="greetingText"></span>
      <div class="card-divider"></div>
      <span class="card-sign">— 永远爱你的孩子</span>
    </div>
  </div>

  <!-- 按钮 -->
  <div class="btn-wrap">
    <button class="blessing-btn" onclick="openBlessing()">
      <span class="btn-dot"></span>
      <span class="btn-dot"></span>
      <span>点击送上祝福</span>
      <span class="btn-dot"></span>
      <span class="btn-dot"></span>
    </button>
  </div>

  <!-- 底部 -->
  <div class="footer">
    <h3>妈妈，我爱你</h3>
    <div class="hearts"><span>♥</span><span>♥</span><span>♥</span></div>
    <span class="sub">不止今天，每一天</span>
  </div>

</div>

<!-- ========== 祝福弹层 ========== -->
<div class="blessing-overlay" id="blessingOverlay">
  <!-- 鲜花爱心飘落画布 -->
  <canvas id="fallCanvas"></canvas>

  <!-- 关闭按钮 -->
  <button class="close-btn" onclick="closeBlessing()">✕</button>

  <!-- 大爱心 + 内容 -->
  <div class="giant-heart-box">
    <div class="giant-heart"></div>
    <div class="heart-content" id="heartContent">
      <!-- 倒计时数字 -->
      <span class="countdown-num" id="num3">3</span>
      <span class="countdown-num" id="num2">2</span>
      <span class="countdown-num" id="num1">1</span>
      <!-- 祝福文字 -->
      <div class="blessing-lines" id="blessingLines">
        <span class="blessing-line">妈妈</span>
        <span class="blessing-line">健康顺遂</span>
        <span class="blessing-line">平平安安</span>
        <span class="blessing-line emphasis">母亲节快乐</span>
      </div>
      <!-- 结尾爱心 -->
      <span class="final-big-heart" id="finalHeart">❤️</span>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>
<!-- 微信分享引导 -->
<div class="share-overlay" id="shareOverlay" onclick="this.classList.remove('show')">
  <div class="arrow">
    <span class="icon">☝</span>
    点击右上角<br>「发送给朋友」<br>分享给妈妈 💝
  </div>
</div>

<script>
// ===== 花瓣动画（全局）=====
const canvas = document.getElementById('petalCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const petals = [];
for (let i = 0; i < 28; i++) {
  petals.push({
    x: Math.random() * W, y: -60 - Math.random() * H,
    size: 7 + Math.random() * 12,
    speed: 0.3 + Math.random() * 1.1,
    drift: (Math.random() - 0.5) * 0.7,
    rotation: Math.random() * 360,
    rotSpeed: (Math.random() - 0.5) * 1.8,
    opacity: 0.2 + Math.random() * 0.45,
    color: Math.random() > 0.5 ? '#F2B8BA' : '#F5D5C8'
  });
}

(function loop() {
  ctx.clearRect(0, 0, W, H);
  petals.forEach(p => {
    p.y += p.speed; p.x += p.drift; p.rotation += p.rotSpeed;
    if (p.y > H + 60) { p.y = -60; p.x = Math.random() * W; }
    if (p.x > W + 40) p.x = -40;
    if (p.x < -40) p.x = W + 40;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation * Math.PI / 180);
    ctx.globalAlpha = p.opacity;
    ctx.beginPath();
    ctx.fillStyle = p.color;
    const s = p.size;
    ctx.moveTo(0, -s * 0.8);
    ctx.bezierCurveTo(s * 0.5, -s * 0.4, s * 0.5, s * 0.3, 0, s * 0.6);
    ctx.bezierCurveTo(-s * 0.5, s * 0.3, -s * 0.5, -s * 0.4, 0, -s * 0.8);
    ctx.fill();
    ctx.restore();
  });
  requestAnimationFrame(loop);
})();

// ===== 祝福语 =====
const greetings = [
  '亲爱的妈妈，感谢你用无私的爱陪伴我成长的每一步。你的笑容是我心中最温暖的阳光，你的双手是我最安心的港湾。今天是属于你的节日，愿你永远健康、快乐、美丽。',
  '妈妈，你是我生命中最重要的人。感谢你这么多年来的养育之恩，你的每一句叮咛，每一个拥抱，都是我前进的力量。母亲节快乐！',
  '世界上最美的词汇，就是"妈妈"。你的爱如春风化雨，润物无声。今天是母亲节，我想对你说：谢谢你，我爱你。',
];
document.getElementById('greetingText').textContent = greetings[Math.floor(Math.random() * greetings.length)];

// ===== Toast =====
let toastTimer;
function showToast(text) {
  const t = document.getElementById('toast');
  clearTimeout(toastTimer);
  t.textContent = text;
  t.classList.add('show');
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== 打开祝福弹层 =====
let fallAnimId = null;
let fallTimer = null;

function openBlessing() {
  const overlay = document.getElementById('blessingOverlay');
  overlay.classList.add('show');

  // 重置所有元素
  ['num3','num2','num1'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('pop', 'fade');
  });
  const lines = document.querySelectorAll('.blessing-line');
  lines.forEach(l => l.classList.remove('bounce'));
  document.getElementById('blessingLines').classList.remove('visible');
  document.getElementById('finalHeart').classList.remove('reveal');

  // 启动爱心鲜花飘落画布
  startFallCanvas();

  // 倒计时开始
  setTimeout(() => countdownStart(), 300);
}

function closeBlessing() {
  document.getElementById('blessingOverlay').classList.remove('show');
  if (fallAnimId) { cancelAnimationFrame(fallAnimId); fallAnimId = null; }
  if (fallTimer) { clearTimeout(fallTimer); fallTimer = null; }
}

// ===== 倒计时 =====
function countdownStart() {
  const n3 = document.getElementById('num3');
  const n2 = document.getElementById('num2');
  const n1 = document.getElementById('num1');

  // 3
  setTimeout(() => n3.classList.add('pop'), 0);
  setTimeout(() => {
    n3.classList.add('fade');
    setTimeout(() => { n3.classList.remove('pop','fade'); n2.classList.add('pop'); }, 350);
  }, 1000);

  // 2
  setTimeout(() => {
    n2.classList.add('fade');
    setTimeout(() => { n2.classList.remove('pop','fade'); n1.classList.add('pop'); }, 350);
  }, 2000);

  // 1 -> 文字
  setTimeout(() => {
    n1.classList.add('fade');
    setTimeout(() => {
      n1.classList.remove('pop','fade');
      showWords();
    }, 350);
  }, 3000);
}

// ===== 文字跳动 + 结尾爱心 =====
function showWords() {
  const linesEl = document.getElementById('blessingLines');
  linesEl.classList.add('visible');

  const lines = linesEl.querySelectorAll('.blessing-line');
  lines.forEach((line, i) => {
    setTimeout(() => line.classList.add('bounce'), i * 650);
  });

  // 最后大爱心
  const totalDelay = lines.length * 650 + 500;
  setTimeout(() => {
    document.getElementById('finalHeart').classList.add('reveal');
  }, totalDelay);
}

// ===== 爱心鲜花飘落画布 =====
function startFallCanvas() {
  const fc = document.getElementById('fallCanvas');
  const fctx = fc.getContext('2d');
  fc.width = window.innerWidth;
  fc.height = window.innerHeight;

  const items = [];
  const heartColors = ['#E88186','#F2A6A9','#E8989B','#D4888A','#F5C4B8','#E8A0A4','#F0B0B3','#E07075'];
  const petalColors = ['#F2B8BA','#F5D5C8','#FDE0D3','#F2D4D6','#FDE8E9','#F4C8CA'];

  // 初始化
  for (let i = 0; i < 40; i++) {
    items.push(createItem(fc));
  }

  function createItem(canvas) {
    const type = Math.random() < 0.45 ? 'heart' : 'petal';
    // 让它们从大爱心周围开始
    const cx = canvas.width / 2;
    const spread = canvas.width * 0.8;
    return {
      type,
      x: cx + (Math.random() - 0.5) * spread,
      y: -40 - Math.random() * canvas.height,
      size: type === 'heart' ? 12 + Math.random() * 22 : 8 + Math.random() * 16,
      speed: 0.5 + Math.random() * 1.8,
      drift: (Math.random() - 0.5) * 1.1,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 2.5,
      opacity: 0.4 + Math.random() * 0.55,
      color: type === 'heart'
        ? heartColors[Math.floor(Math.random() * heartColors.length)]
        : petalColors[Math.floor(Math.random() * petalColors.length)],
      swing: Math.random() * Math.PI * 2,
      swingSpeed: 0.02 + Math.random() * 0.04,
      swingAmp: 15 + Math.random() * 35,
    };
  }

  function draw() {
    fctx.clearRect(0, 0, fc.width, fc.height);

    items.forEach(item => {
      item.y += item.speed;
      item.swing += item.swingSpeed;
      item.x += item.drift + Math.sin(item.swing) * 0.6;
      item.rotation += item.rotSpeed;

      if (item.y > fc.height + 60) {
        item.y = -60;
        item.x = fc.width/2 + (Math.random() - 0.5) * fc.width * 0.8;
      }
      if (item.x > fc.width + 60) item.x = -60;
      if (item.x < -60) item.x = fc.width + 60;

      fctx.save();
      fctx.translate(item.x, item.y);
      fctx.rotate(item.rotation * Math.PI / 180);
      fctx.globalAlpha = item.opacity;
      fctx.fillStyle = item.color;

      if (item.type === 'heart') {
        // 画爱心
        const s = item.size * 0.55;
        fctx.beginPath();
        fctx.moveTo(0, s * 0.25);
        fctx.bezierCurveTo(0, -s*0.05, s*0.5, -s*0.25, s*0.5, s*0.35);
        fctx.bezierCurveTo(s*0.5, s*0.75, 0, s*1.15, 0, s*1.25);
        fctx.bezierCurveTo(0, s*1.15, -s*0.5, s*0.75, -s*0.5, s*0.35);
        fctx.bezierCurveTo(-s*0.5, -s*0.25, 0, -s*0.05, 0, s*0.25);
        fctx.fill();
      } else {
        // 画花瓣
        const s = item.size;
        fctx.beginPath();
        fctx.moveTo(0, -s*0.7);
        fctx.bezierCurveTo(s*0.45, -s*0.35, s*0.45, s*0.25, 0, s*0.55);
        fctx.bezierCurveTo(-s*0.45, s*0.25, -s*0.45, -s*0.35, 0, -s*0.7);
        fctx.fill();
      }

      fctx.restore();
    });

    fallAnimId = requestAnimationFrame(draw);
  }

  draw();

  // 持续补充元素
  fallTimer = setInterval(() => {
    if (items.length < 70) {
      items.push(createItem(fc));
    }
  }, 400);
}
</script>
</body>
